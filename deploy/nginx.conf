# «روابط درويش» — __DOMAIN__ (يتولّد من deploy/install.sh؛ متعدّلش النسخة في /etc/nginx)
# ورا Cloudflare (SSL على الحافة) — نفس نمط quran.darwish-tech.com
server {
    listen 80;
    server_name __DOMAIN__;

    access_log /var/log/nginx/links.access.log;
    error_log  /var/log/nginx/links.error.log;

    client_max_body_size 1M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 60s;
    }
}
